name: release-mcp

# Publish the two MCP server packages, each on its own tag:
#   - `mcp-v*`       → @suiflex/suitest-mcp      → npm  (npx -y @suiflex/suitest-mcp)
#   - `lifecycle-v*` → suiflex-suitest-lifecycle → PyPI (uvx --from suiflex-suitest-lifecycle suitest-mcp)
#
# They share this file because they are the same server in two package
# managers, but every job is gated on its own tag family — a lifecycle tag
# must not reach the npm jobs, and an mcp tag must not reach the PyPI one.
# Lifecycle used to ride the mcp tag, which meant its version could only ever
# be published as a side effect of an mcp release.
#
# npm uses OIDC Trusted Publishing; no long-lived NPM_TOKEN is required. PyPI
# still uses PYPI_TOKEN. On PRs, the build + smoke + dry-run steps validate.

on:
  push:
    tags: ["mcp-v*", "lifecycle-v*"]
  pull_request:
    paths:
      - "packages/mcp-npx/**"
      - "packages/lifecycle/**"
      - "packaging/suitest-mcp.*.tmpl"
      - "scripts/build-dist-bundle.sh"
      - "scripts/publish-installers.sh"
      - ".github/workflows/release-mcp.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing mcp-v* or lifecycle-v* release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  npm:
    name: "@suiflex/suitest-mcp → npm"
    if: >-
      github.event_name == 'pull_request' ||
      startsWith(github.ref, 'refs/tags/mcp-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mcp-npx
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22" # node --test glob patterns need >= 21
          registry-url: "https://registry.npmjs.org"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Smoke test (bundle sync + MCP boot)
        run: npm test

      - name: Validate package contents (publish dry-run)
        run: |
          npm pack --dry-run
          npm publish --dry-run --access public

      - name: Validate the brew/scoop bundle and its rendered installers
        working-directory: ${{ github.workspace }}
        run: |
          ./scripts/build-dist-bundle.sh packages/mcp-npx suitest-mcp
          DRY_RUN=1 ./scripts/publish-installers.sh suitest-mcp suitest-mcp \
            https://example.invalid/dl

  publish-npm:
    name: "@suiflex/suitest-mcp → npm"
    if: startsWith(github.ref, 'refs/tags/mcp-v')
    needs: [npm]
    runs-on: ubuntu-latest
    # OIDC Trusted Publishing: npm trusts this repository, workflow, and the
    # `release` environment, so GitHub mints a short-lived token per publish.
    environment: release
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: packages/mcp-npx
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11.5.2
      - name: Tag matches package version
        run: |
          TAG_VERSION="${RELEASE_TAG:-${GITHUB_REF_NAME#mcp-v}}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          [ "$TAG_VERSION" = "$PKG_VERSION" ] || {
            echo "tag $GITHUB_REF_NAME != package.json $PKG_VERSION" >&2; exit 1; }
      - name: Publish to npm
        run: npm publish --access public

  publish-installers:
    name: "suitest-mcp → homebrew-tap + scoop-bucket"
    if: startsWith(github.ref, 'refs/tags/mcp-v')
    # After the npm publish, so a formula never points at a version npm rejected.
    needs: [publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload the bundle to it
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the self-contained bundle tarball
        run: ./scripts/build-dist-bundle.sh packages/mcp-npx suitest-mcp
      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            dist/suitest-mcp-*.tar.gz dist/suitest-mcp-*.tar.gz.sha256 --clobber
      - name: Render and push the formula and the manifest
        env:
          GH_TOKEN: ${{ secrets.TAP_PUBLISH_TOKEN }}
        run: |
          ./scripts/publish-installers.sh suitest-mcp suitest-mcp \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

  recover-npm:
    name: "Recover @suiflex/suitest-mcp npm publish"
    if: startsWith(inputs.tag, 'mcp-v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: packages/mcp-npx
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11.5.2
      - name: Tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          TAG_VERSION="${RELEASE_TAG#mcp-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          [ "$TAG_VERSION" = "$PKG_VERSION" ] || {
            echo "tag $RELEASE_TAG != package.json $PKG_VERSION" >&2; exit 1; }
      - name: Publish to npm
        run: npm publish --access public

  pypi:
    name: "suiflex-suitest-lifecycle → PyPI"
    if: >-
      startsWith(github.ref, 'refs/tags/lifecycle-v') ||
      startsWith(inputs.tag, 'lifecycle-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: uv build --project packages/lifecycle -o dist

      - name: Boot smoke via console script
        env:
          SUITEST_API_URL: http://127.0.0.1:41999
          SUITEST_API_KEY: sk_suitest_ci
        run: |
          # The server refuses to boot without valid credentials — run a whoami stub.
          python3 scripts/mcp_whoami_stub.py &
          for i in $(seq 1 50); do
            curl -sf -o /dev/null -H "Authorization: Bearer $SUITEST_API_KEY" \
              "$SUITEST_API_URL/api/v1/api-keys/whoami" && break
            sleep 0.1
          done
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}\n' \
            | uvx --from "$(ls dist/*.whl)" suitest-mcp \
            | python3 -c 'import sys, json; m = json.loads(sys.stdin.readline()); assert "suitest" in m["result"]["serverInfo"]["name"]; print("boot OK")'

      - name: Publish lifecycle package
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path

          metadata = Path("packages/lifecycle/pyproject.toml").read_text()
          version = next(
              line.split("=", 1)[1].strip().strip('"')
              for line in metadata.splitlines()
              if line.startswith("version =")
          )
          url = f"https://pypi.org/pypi/suiflex-suitest-lifecycle/{version}/json"

          try:
              with urllib.request.urlopen(url) as response:
                  release = json.load(response)["urls"]
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  release = []
              else:
                  raise

          remote = {item["filename"]: item["digests"]["sha256"] for item in release}
          local = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in Path("dist").iterdir()
              if path.is_file()
          }
          mismatched = {
              name: (digest, remote.get(name))
              for name, digest in local.items()
              if name in remote and remote[name] != digest
          }

          if mismatched:
              print(
                  f"PyPI version {version} already contains different artifacts: "
                  f"{sorted(mismatched)}. Bump the lifecycle version.",
                  file=sys.stderr,
              )
              sys.exit(1)

          missing = sorted(set(local) - set(remote))
          if not missing and local:
              print(f"PyPI version {version} already matches dist; skipping publish")
              sys.exit(0)

          print(f"Publishing lifecycle version {version}; missing artifacts: {missing}")
          PY
          uv publish --check-url https://pypi.org/simple/ dist/*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
